volumes:
  redis-data:

networks:
  stack:
    name: stack

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks: [stack]
    ports:
      - "${REDIS_PORT:-6379}:6379"

  calcom:
    platform: linux/amd64
    image: calcom/cal.com:latest
    container_name: calcom
    restart: unless-stopped
    networks: [stack]
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL}
      REDIS_URL: ${REDIS_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL}
      ALLOWED_HOSTNAMES: '["localhost:3000"]'
    depends_on:
      - redis

  # Optional: Cal.com API v2 container. Remove if you don't need it.
  calcom-api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/api/v2/Dockerfile
    container_name: calcom-api
    restart: unless-stopped
    networks: [stack]
    ports:
      - "${API_PORT:-5555}:${API_PORT:-5555}"
    env_file: .env
    environment:
      API_PORT: ${API_PORT}
      API_URL: ${API_URL}
      JWT_SECRET: ${JWT_SECRET}
      WEB_APP_URL: ${WEB_APP_URL}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_READ_URL: ${DATABASE_URL}
      DATABASE_WRITE_URL: ${DATABASE_URL}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      REDIS_URL: ${REDIS_URL}
      REWRITE_API_V2_PREFIX: "true"
    depends_on:
      - redis
